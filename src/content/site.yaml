# Site-wide copy and status. The pages read this; edit here rather than in the templates.
name: weird little apps
subtitle: purveyors of fine apps
established: 2026
by:
  name: vivian qu
  short: vivian   # the about page's rubber stamp: "made by vivian"
  url: https://vivqu.com/
lede: Apps built with purpose. Tiny by design. Made with love.
description: a hand-picked collection of small, strange software.

# the post the site grew out of, and its motto (on the about page's sticky note)
post: https://vivqu.substack.com/p/making-space-for-weirdness-and-fun
motto: Make the weird thing. The right people will find it.

# the status block on the about page; {apps} becomes "43 apps", linked to the index
status: collected {apps}
next: filtering and searching

# the suggestion box at /suggest/ (see .claude/FORM.md). `endpoint` is the Apps Script web app's /exec url;
# until it's set the page says the box isn't out yet and nothing links to it
suggest:
  endpoint: https://script.google.com/macros/s/AKfycbwPrmBQCSSncmRJstdjV0ZGDS5Fw914iVnjy2bqCtYZLjsTDGb9mwWz0vasNPzKOj5j/exec
  invite: know a weird little app? we're always looking for more curators to contribute.
  thanks: we're excited to check out this weird app!
  reach: we'll send you an update once it's reviewed.
  noreach: check back to see if it gets added.

# the counting pixel (see .claude/ANALYTICS.md): page views and visit-button clicks are counted at this GoatCounter site.
# Leave it out and nothing is sent. Only production builds render it (CI, or WLA_STATS=1 npm run build)
stats:
  goatcounter: https://vivqu.goatcounter.com
