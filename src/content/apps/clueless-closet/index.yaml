quotes:
  - text: "Clueless came out in 1995 and presented us with the most iconic closet of all, years ahead of its time. Cher Horowitz's wardrobe didn't try to sell her new products or make AI-powered suggestions. The background was leopard print, the buttons were gigantic, this computer probably wasn't even connected to the internet. It just helped her put together killer outfits and get ready for school a little faster."
    url: https://jessiechar.com/closet
