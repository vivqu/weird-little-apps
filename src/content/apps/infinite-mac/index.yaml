quotes:
  - text: It’s a golden age of emulation. Between increasing CPU power, WebAssembly, and retrocomputing being so popular The New York Times is covering it, it’s never been easier to relive your 80s/90s/2000s nostalgia.
    url: https://blog.persistent.info/2022/03/blog-post.html
    date: 2022-03-31
  - text: Infinite Mac has a new home at infinitemac.org. Using a new Emscripten port of Mini vMac, it is now able to run almost every notable version of Mac OS, from 1984’s System 1.0 to 2000’s Mac OS 9.0.4.
    url: https://blog.persistent.info/2023/03/infinitemac-dot-org.html
    date: 2023-03-28

