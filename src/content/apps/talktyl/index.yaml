quotes:
  - text: My friend Jeremy and I were kicking ideas back and forth. We came up with an idea for an audio time capsule where recordings are returned to your future self. We built a series of prototypes and finally launched a version to the general public. Now available on both web and iOS, our pilot users have completed nearly 200 recordings in just the first few weeks.
    url: https://www.robinsongreig.com/work/ttyl
