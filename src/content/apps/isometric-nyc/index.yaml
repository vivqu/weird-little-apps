quotes:
  - text: Growing up, I played a lot of video games, and my favorites were world building games like SimCity 2000 and Rollercoaster Tycoon. As a core millennial rapidly approaching middle age, I’m a sucker for the nostalgic vibes of those late 90s / early 2000s games. As I stared out at the city, I couldn’t help but imagine what it would look like in the style of those childhood memories.
    url: https://cannoneyed.com/projects/isometric-nyc
  - text: I switched back and forth a lot between Claude Code, Gemini CLI, and Cursor (using both Opus 4.5 and Gemini 3 Pro) and as far as I’m concerned they all worked pretty well.
    url: https://cannoneyed.com/projects/isometric-nyc
  - text: |-
      I wanted to share something I built over the last few weeks: isometric.nyc is a massive isometric pixel art map of NYC, built with nano banana and coding agents.

      I didn't write a single line of code.
    url: https://x.com/_coenen/status/2014359718697799989
    date: 2026-01-22
    embed: true

