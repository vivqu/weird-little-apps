quotes:
  - text: did you make it into the superintelligences? are you in the weights?
    url: https://x.com/turtlesoupy/status/2067660484963410361
    by: Thomas Dimson
    date: 2026-06-18
    embed: true
  - text: |-
      With more traffic moving off-web and into LLMs, I got curious about what traces we leave "in the weights". My design partner and I built a site in the past few weeks that checks recognition across frontier and small models. It queries many of them in parallel, clusters the responses, and tells you how strongly they recognize you.
    url: https://news.ycombinator.com/item?id=48591348
    by: Thomas Dimson
    date: 2026-06-18
  - text: Not cheap for sure but it's all for fun! I have done some optimizations to try to get cost as low as possible; the final clustering actually uses Kimi K2 for this reason.
    url: https://news.ycombinator.com/item?id=48592220
    by: Thomas Dimson
    date: 2026-06-18
