why: for people who notice the light. i open it in november when the afternoons start disappearing.
collected: 2026-08-01

created: 2026
price: $2.99
quotes:
  - text: "Shipped my first app ever today 🎉 A small iOS app that tracks daylight and lets you log a daily gratitude. Nothing revolutionary, but it's mine and I built it from scratch. If you're into sunlight, slow mornings, or just curious what a product designer builds when left unsupervised, give it a try!"
    url: https://www.threads.com/@yannisabelas/post/DafYwfKmbhj
    date: 2026-07-07
  - text: "I'm literally building my app, and promoting it on Threads between diaper changes and playing with my daughter. 😅 If I can do it, you can do it too!"
    url: https://www.threads.com/@yannisabelas/post/Da5i2DkCJdd
    date: 2026-07-17
  - text: |
      The sky of the Heliophilia app is actually different per climate around the world. Each gradient has been carefully crafted to represent the sky for a specific location and time of the day. With the next update I am introducing an additional climate: Mediterranean. Plus making the rest a bit more accurate. Small details that make the app feel more real.
    url: https://www.threads.com/@yannisabelas/post/DbSonXDl_SA
    date: 2026-07-27
