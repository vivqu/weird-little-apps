quotes:
  - text: Now designers like us can build the fun little things. Designers like us can ship the crazy ideas. Designers like us can make unreasonable little things and see if the world cares.
    url: https://x.com/jipvandervelde/status/2062258773264408583
    by: Jip van der Velde
    date: 2026-06-03
  - text: grug is probably the first Apple Design Award winner built by two designers using Codex to write the code.
    url: https://x.com/jipvandervelde/status/2062258773264408583
    by: Jip van der Velde
    date: 2026-06-03
    embed: true
    media: true
  - text: |-
      The first versions used existing handwritten fonts, but they looked too clean and polished. Almost as a joke, we asked: What if we draw the whole thing ourselves?

      In this case, the joke became the technical foundation. We built a font-drawing canvas directly inside grug, then built a rendering engine that could use those drawings as a custom type system.
    url: https://developer.apple.com/news/?id=ux44ymcr
    by: Jip van der Velde
    date: 2026-05-16
  - text: If we had compromised on the handwritten engine early, grug would probably feel like a quote app with a cute font. Instead, it feels like its own little world.
    url: https://developer.apple.com/news/?id=ux44ymcr
    by: Michel Elings
    date: 2026-05-16
