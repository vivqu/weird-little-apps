screenshots:
  - image: ./landing.jpg
    alt: a pale page headed apartment birds, heard recently, with a dozen vintage field-guide illustrations scattered in a loose collage, each with a handwritten label, from a large american crow and house finch in the middle to a cooper's hawk, anna's hummingbird and bushtit around them, and a 1h to all time range switch in the corner
    caption: heard in the last 24 hours
    taken: 2026-10-05
  - image: ./all-birds.jpg
    alt: the same collage with the range set to all time, now some sixty small bird illustrations packed into a cloud, from gulls and ducks to warblers and woodpeckers
    caption: every bird the window has ever heard
    taken: 2026-10-05
  - image: ./stats.jpg
    alt: the stats view, a chart of twelve species as dotted bars with their first detection time underneath, beside tables for detections by period, top species led by american crow with 18, and first detections with hutton's vireo added today
    caption: the stats tab, with a life list
    taken: 2026-10-05
  - image: ./atlas.jpg
    alt: the avian atlas, each species drawn as a postage stamp in a different style, from a rainbow-striped hutton's vireo and a bold black-and-white bushtit to a checkerboard american crow and a red house finch repeat
    caption: one stamp per species
    taken: 2026-10-05
