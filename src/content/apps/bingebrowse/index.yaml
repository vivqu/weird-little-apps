quotes:
  - text: "“Originally we were drawn to the idea of creating something which mixed the physical and the digital world.”"
    url: https://www.whats-on-netflix.com/what-to-watch/bingebuster-3d-virtual-blockbuster-netflix-browser/
    date: 2026-07-31
  - text: "‘Our audience has really responded to the nostalgia of revisiting the video stores of their past, but also to having a chance to browse streaming sites without the constant invisible hand of the algorithm. It's something both Patrick and I have fond memories of as children too – being 27 years old we just about remember the last days of video stores here in the UK.’"
    url: https://www.timeout.com/news/bingebrowse-online-video-store-081826
    date: 2026-08-18
recs:
  - { title: This digital Blockbuster clone is a beautiful nostalgia trip, url: https://www.pcworld.com/article/3211823/this-digital-blockbuster-clone-is-a-beautiful-nostalgia-trip.html, by: PCWorld, date: 2026-08-13 }
  - { title: Browse streaming movies like you’re in a video store with this cool new website, url: https://www.timeout.com/news/bingebrowse-online-video-store-081826, by: Time Out, date: 2026-08-18 }
  - { title: "Nostalgic fans are resurrecting the Blockbuster video store — free DVD and Blu-ray drop-boxes are multiplying on streets as a new 3D website turns Netflix into a retro rental store", url: https://www.techradar.com/streaming/blockbuster-is-making-an-unlikely-comeback-neighborhood-free-blockbuster-boxes-are-multiplying-for-dvd-and-blu-ray-fans-as-new-website-turns-netflix-into-a-3d-video-store, by: TechRadar, date: 2026-08-19 }
