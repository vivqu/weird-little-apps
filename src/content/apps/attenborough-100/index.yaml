name: Attenborough at 100
tagline: seventy years of attenborough in one search box. type an animal, a habitat or a place and get the episodes.
url: https://attenborough-100.vercel.app/
form_factor: web
by:
  - name: Soph Warnes
    url: https://www.sophiewarnes.com/
why: the best kind of hyperfixation.
collected: 2026-07-20

created: 2026-05-15
quotes:
  - text: |
      I was annoyed that I couldn't find a database of David Attenborough documentaries where I could search for a specific episode by topic.

      So I made it.
    url: https://x.com/SophWarnes/status/2055248265881223382
recs:
  - { title: 'Rest with a receipt', url: https://www.densediscovery.com/issues/392, by: Dense Discovery, date: 2026-06-08 }
  - { title: 'A searchable archive of the almost 5000 TV episodes that naturalist David Attenborough has worked on', url: https://kottke.org/26/06/0049156-a-searchable-archive-of-the-al, by: Jason Kottke, date: 2026-06-17 }

