quotes:
  - text: |-
      Eigendrum treats whatever you draw as an ideal drumhead clamped at its rim, solves the Laplacian eigenvalue problem on that exact region using real finite elements, and synthesises the frequencies it finds. Nothing is sampled and no overtone is faked: draw a circle and the overtones come out as ratios of Bessel function zeros, because that's what a circular drum actually does.
    url: https://github.com/BaselAshraf81/eigendrum
