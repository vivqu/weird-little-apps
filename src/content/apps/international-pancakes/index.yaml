quotes:
  - text: My favorite part is the entirely arbitrary categorization. Is Pannenkoek savory or sweet? Where does a ‘flat’ pancake end and a crepe begin? If you shape a pancake in a shaped round pan (like the aforesaid hoppers) does that make them… a waffle?
    url: https://attainablefelicity.mattkirkland.com/20240903/pancakes.html
    date: 2024-09-03
  - text: In my ongoing war against BIG PANCAKE and their attempts to conceal delicious treats from us Americans, I've now added recipes to every secret pancake on internationalpancakes.com
