quotes:
  - text: |-
      I want to continue my exploration of normie-friendly packaging for prediction market probabilities.

      Most prediction market platform UI's are trader-centric. This makes sense because without traders, markets are no good. However, prediction markets have a second, much larger 'lurker' audience that I believe is underserved by the major platforms.
    url: https://manifund.org/projects/normie-friendly-prediction-market-interfaces
    date: 2025-10-29
