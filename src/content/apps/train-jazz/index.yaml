name: Every train, a note
tagline: every nyc subway train as a jazz note
url: https://www.trainjazz.com/
form_factor: web
by:
  - name: Joshua Wolk
    url: https://www.joshuawolk.com
why: jazz and data viz is the best combo
collected: 2026-08-29

created: 2026-04-10
tags: [next-js]
quotes:
  - text: Every dot is a real subway train. Eight hundred of them, give or take, form a small jazz combo (walking bass, piano, sax, vibes, brushes) that has been playing without pause for over a hundred years.
    url: https://www.trainjazz.com/
  - text: My rule for making Train Jazz was, is this something I could listen to for 3 hours straight without finding it super annoying? And when I finally got to that point, it did become something that I would listen to.
    url: https://www.npr.org/2026/08/09/nx-s1-5917185/a-website-makes-music-using-the-real-time-new-york-city-subway-schedule
    date: 2026-08-09
  - text: |-
      Introducing Train Jazz, a live experience from Amtrak and @away, turning every active train in the country into a musical note.

      Web Design by Joshua Wolk/@joshuawolk
    url: https://x.com/Amtrak/status/2086890457221476648
    by: Amtrak
    date: 2026-08-10
    embed: true
