quotes:
  - text: |-
      A browser-based risograph studio. Upload a photo, load up to six ink drums with real Riso ink colors, and fine-tune separations, screens, registration, paper stock, and press condition in real time.

      Registration — per-drum offset and skew, plus a SHAKE button, because riso never lines up twice.
    url: https://github.com/jgfall/inkdrum
  - text: 100% ORGANIC SOY INK · SHAKE WELL. MISPRINTS ARE PART OF THE FUN!
    url: https://www.inkdrum.app/
