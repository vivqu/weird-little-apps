quotes:
  - text: |-
      In the depths of winter, I created inprogress.works as a reaction to the slow decline of social media.

      The manifestation of these beliefs was inprogress.works, a website for people to post their side projects on a weekly basis. More importantly, you wouldn’t be able to see others’ posts unless you posted yourself.
    url: https://waves.connie.surf/p/small-networks
    date: 2026-03-28
  - text: "Instagram and Twitter are still the public townsquares and inprogress.works is like the indie cafe that opened just down the street."
    url: https://waves.connie.surf/p/small-networks
    date: 2026-03-28
  - text: |-
      homepage refresh to show more posts from the community!

