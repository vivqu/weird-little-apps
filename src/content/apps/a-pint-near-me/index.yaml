  - text: |-
      There has been quite a bit in the news recently about 2 pubs per day closing according to the British Beer and Pub Association. That got me thinking about which areas of the country were best served and where were the dry zones?
    url: https://knowwhereconsulting.co.uk/blog/nearest-pint-pub-density-map/
    date: 2026-05-11
  - text: |-
      After I had got over my 15 seconds of relative fame, I wondered whether I could do something better mapping pubs in the UK. I asked my new friend Claude Code what we could do with the FHRS data and the pubs data on OSM, a good bit of whirring and numerous back and forths and data testing/verification and we had a data pipeline.
    url: https://knowwhereconsulting.co.uk/blog/a-pint-near-me/
    date: 2026-09-08
